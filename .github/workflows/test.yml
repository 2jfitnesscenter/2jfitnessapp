# Runs on pull requests too — the other two workflows only fire on push to main, so
# contributed changes used to reach main without anything ever having been run.
name: Tests

on:
  # No paths filter on pull requests: main requires the test / api / api-image checks, and a filtered workflow never reports them for docs- or scripts-only PRs,
  # which would make those PRs unmergeable. (The push trigger below keeps its filter: nothing is required there.)
  pull_request:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'scripts/build-coach-library.mjs'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node:22-alpine in web/Dockerfile and api/Dockerfile — CI must match production.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # v1.3.1 — frontend/src/lib/coach.test.js reaches directly into ../../../api/coach/*.js to
      # cross-check the client and server payload/validation logic stay in sync (a real,
      # deliberate cross-package import, not something to undo here — see AI_HANDOFF.md for the
      # architectural debt this documents: two independent package.json/node_modules trees with
      # one test file that straddles both). That chain pulls in api/coach/adapters/claude.js,
      # which imports the real @anthropic-ai/claude-agent-sdk — so this job needs api's own
      # dependencies installed too, not only frontend's, or that one file fails to even load.
      - run: npm ci
        working-directory: api
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      - name: Upload locale coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: locale-coverage
          path: frontend/locale-coverage.json
          if-no-files-found: ignore

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: api
      - run: npm test
        working-directory: api
      # The API's copy of the exercise catalogue is generated and committed. A dataset change
      # that forgets to regenerate it would otherwise only surface as "the Coach can't find
      # that exercise" on somebody's instance.
      - run: node scripts/build-coach-library.mjs --check
      # The Premium seed (api/lib/premium-official.json) and the API's copy of the shared program model are generated and committed: a change to
      # scripts/premium/official-programs.mjs or frontend/src/lib/premium-model.js that forgets to regenerate them fails here, not on a gym's phone.
      - run: node scripts/build-premium-programs.mjs --check
      - run: node scripts/sync-premium-model.mjs --check

  # Building the api image is the only place that proves the bundled Claude CLI actually
  # installs and starts on alpine — the Dockerfile runs `claude --version` as a build step.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

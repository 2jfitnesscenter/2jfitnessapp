# Production overlay — adds automatic HTTPS via Caddy in front of the existing `web` service.
# Use together with the base file, never alone:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Caddy terminates TLS for the domains in ./caddy-config/Caddyfile and reverse-proxies to `web`
# over the default Compose network. Its two external networks keep the existing Home and
# synthetic PWA edge upstreams reachable when this service is recreated. `web` stops publishing
# itself on the public interface (only Caddy is internet-facing on 80/443); it still listens on
# 127.0.0.1 so `curl http://localhost:8080` on the server itself keeps working for debugging.
services:
  web:
    # Compose merges list-valued keys across -f files by concatenating them, not replacing —
    # without !override this appends to the base file's public "8080:80" instead of replacing
    # it, so the container ends up trying to publish port 8080 twice (once wide open, once
    # loopback-only) and fails to come up at all.
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy-config:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - home-staging-proxy
      - demo-edge

networks:
  home-staging-proxy:
    external: true
    name: 2j-home-staging-proxy
  demo-edge:
    external: true
    name: 2j-pwa-demo-edge

volumes:
  caddy_data:
  caddy_config:

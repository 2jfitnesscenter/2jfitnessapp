name: 2jfitness

services:
  # Prepare the same exercise images/GIFs the app has historically referenced.
  # Existing local files are kept and never overwritten; the source revision is pinned.
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$(ls -A /out/img 2>/dev/null)" ] && [ -n "$$(ls -A /out/gif 2>/dev/null)" ]; then
          echo "Exercise media already present — skipping download."
        else
          echo "Preparing referenced exercise media from the existing pinned source…"
          git init /tmp/ds
          git -C /tmp/ds remote add origin https://github.com/hasaneyldrm/exercises-dataset
          git -C /tmp/ds fetch --depth 1 origin 7455efae41b330c265e7cd4b78dfa848e7ce5ebd
          git -C /tmp/ds checkout --detach FETCH_HEAD
          mkdir -p /out/img /out/gif
          for file in /tmp/ds/images/*.jpg; do [ -e "$$file" ] || continue; [ -e "/out/img/$${file##*/}" ] || cp "$$file" /out/img/; done
          for file in /tmp/ds/videos/*.gif; do [ -e "$$file" ] || continue; [ -e "/out/gif/$${file##*/}" ] || cp "$$file" /out/gif/; done
          echo "Exercise media ready ($$(ls /out/img | wc -l) images)."
        fi
    restart: "no"

  # Passkey auth + per-user data (Node, no framework).
  # image: prebuilt (docker compose pull). build: from source (docker compose up --build).
  api:
    image: 2jfitness-api:latest
    build: ./api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    env_file: .env
    environment:
      - PORT=3000            # internal port (nginx proxies here) — do not change
      - DATA_DIR=/data
      - COACH_CODEX_HOME=/codex
    volumes:
      - ./data:/data         # users, passkeys, per-user state — BACK THIS UP (the session/encryption secret stays here until SECRET_FILE is set)
      # Optional key separation (docs/KEY_SEPARATION.md): set SECRET_FILE=/secrets/secret in .env and the secret lives here,
      # outside ./data, so data backups do not carry the key to their own ciphertext. Unused (empty dir) until then.
      - ${SECRETS_DIR:-./secrets}:/secrets
      # ChatGPT/Codex refresh tokens are kept separate from app data and mounted only into the
      # API container. This directory is owned by the unprivileged Coach runtime.
      - ./data/codex:/codex

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and exercise media from the shared volume. Single origin for passkeys.
  web:
    image: 2jfitness-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      media:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro

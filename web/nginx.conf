# 2J Fitness Center — standalone web server: serves the static app AND proxies /api to the backend,
# so the whole app lives on ONE origin (required for WebAuthn / passkeys).
map $uri $cache_control {
    ~^/api/                             "no-store";
    ~^/assets/                          "public, max-age=31536000, immutable";
    ~*\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ "public, max-age=2592000, immutable";
    default                             "no-cache, must-revalidate";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $cache_control always;

    # API → backend container
    location /api/ {
        # nginx's own default (1M) is well under the api's 5MB body cap (server.js's MAX_BODY) —
        # without raising it here, a Social image upload gets a silent 413 before ever reaching
        # the api's own, more specific validation (saveUploadedImage's 2MB decoded limit).
        client_max_body_size 6M;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite content-hashed assets are immutable. gzip_static picks the precompressed file made
    # in web/Dockerfile and keeps the original content type (including text/javascript).
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # The app shell and mutable PWA metadata always revalidate. Hash-router deep links resolve
    # through this fallback; web builds use base=/ while demo/mobile keep their relative base.
    location = /index.html { }
    location = /manifest.json { }
    location = /sw.js { }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Exercise images/GIFs never change → cache hard
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
    }

    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}

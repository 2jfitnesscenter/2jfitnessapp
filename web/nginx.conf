# 2J Fitness Center — standalone web server: serves the static app AND proxies /api to the backend,
# so the whole app lives on ONE origin (required for WebAuthn / passkeys).
map $uri $cache_control {
    ~^/api/                             "no-store";
    ~^/assets/                          "public, max-age=31536000, immutable";
    ~*\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ "public, max-age=2592000, immutable";
    default                             "no-cache, must-revalidate";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Built from 2J's real resources (checked against the built app): own origin only, Google Fonts for the Sora headline
    # face, data:/blob: images for the share cards and PDF/print windows. No inline or eval'd script, no workers, no sockets.
    # style-src keeps 'unsafe-inline' because React sets style="" attributes. frame-ancestors 'self' matches X-Frame-Options.
    # The Android shell loads this same origin, so passkeys (WebAuthn), the Health bridge and Web Push are not CSP-governed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    # Sensors the app really uses stay available to itself (geolocation for the gym badge, Bluetooth for the HR strap);
    # everything it never uses is switched off.
    add_header Permissions-Policy "geolocation=(self), bluetooth=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cache-Control $cache_control always;

    # API → backend container
    location /api/ {
        # Match server.js MAX_BODY (12 MiB); the API applies its stricter per-route limits,
        # including MAX_SCAN_BYTES (8 MiB), and returns the appropriate error itself.
        client_max_body_size 12M;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite content-hashed assets are immutable. gzip_static picks the precompressed file made
    # in web/Dockerfile and keeps the original content type (including text/javascript).
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # The app shell and mutable PWA metadata always revalidate. Hash-router deep links resolve
    # through this fallback; web builds use base=/ while demo/mobile keep their relative base.
    location = /index.html { }
    location = /manifest.json { }
    location = /sw.js { }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Exercise images/GIFs never change → cache hard
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
    }

    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
